<style>
:root{--bg:#f6f7fb;--sf:#eceef6;--cd:#fff;--tx:#1b1b1f;--mu:#5f6368;--ac:#6d4cff;--lk:#5a3df0;--bd:#e2e4ee;--ok:#0f8a4a;--er:#d92d4a;--wa:#b7791f;--ct:#ece8ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--sf:#23242b;--cd:#18191e;--tx:#e6e6ea;--mu:#9a9fb0;--bd:#2c2e38;--lk:#b6a9ff;--ok:#3ddc84;--er:#ff6b81;--wa:#f5b942;--ct:#2b2650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101014;--sf:#23242b;--cd:#18191e;--tx:#e6e6ea;--mu:#9a9fb0;--bd:#2c2e38;--lk:#b6a9ff;--ok:#3ddc84;--er:#ff6b81;--wa:#f5b942;--ct:#2b2650;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Google Sans","Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:12}
h1,h2,h3{margin:.3em 0;letter-spacing:-.01em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--cd);border-bottom:1px solid var(--bd);animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:20px;letter-spacing:.03em}
.brand img{border-radius:10px;animation:fl 5s ease-in-out infinite;box-shadow:0 0 14px #7b5cff88}
.brand small{font-weight:600;font-size:13px;letter-spacing:0;padding:2px 10px;border-radius:99px;background:var(--ct);color:var(--lk)}
.acct{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7b5cff,#22d3ee);color:#fff;font-weight:800;animation:pop .6s both}
.rail{position:fixed;z-index:10;display:flex;background:var(--cd)}
.rail a{display:flex;align-items:center;gap:14px;color:var(--mu);text-decoration:none;font-weight:600;transition:background .3s,color .3s,transform .3s;animation:slide .5s both;animation-delay:calc(var(--i,0)*70ms)}
.rail a:hover{background:var(--sf)}
.rail a.on{background:var(--ct);color:var(--lk)}
body.out .rail{display:none}
@media(max-width:819px){.rail{left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--bd)}.rail a{flex:1;flex-direction:column;gap:2px;padding:8px 0;font-size:12px}main{padding-bottom:96px!important}.acct .mu{display:none}}
@media(min-width:820px){.rail{left:0;top:calc(57px + env(safe-area-inset-top,0px));bottom:0;width:236px;flex-direction:column;gap:4px;padding:14px 10px;border-right:1px solid var(--bd)}.rail a{padding:12px 18px;border-radius:99px}.rail a:hover{transform:translateX(4px)}main{padding-left:260px!important}body.out main{padding-left:16px!important}}
main{max-width:1180px;margin:0 auto;padding:18px 16px 28px}
#v>*{animation:pg .5s cubic-bezier(.2,.8,.2,1) both}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-within{outline:3px solid var(--lk);outline-offset:2px}
small,.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.stat b{display:block;font-size:34px;line-height:1.1}
.pb{height:6px;border-radius:6px;background:var(--sf);overflow:hidden;margin:10px 0 6px}
.pb>i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--ac),#22d3ee);border-radius:6px;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.ck{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--mu);animation:slide .5s both;animation-delay:calc(var(--i,0)*90ms)}
.dt{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:#fff;flex:none}
.ck.done{color:var(--tx)}.ck.done .dt{background:var(--ok);border-color:var(--ok)}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .15s forwards}
.btn{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;justify-content:center;height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--ac)}
.btn:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn.alt{background:none;color:var(--lk);box-shadow:inset 0 0 0 1.5px var(--bd)}
.btn.bad{background:var(--er)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;transition:border-color .3s,box-shadow .3s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ct)}
.f{display:grid;gap:4px;font-weight:600;font-size:14px;margin-bottom:14px}
.f small{font-weight:400}
.err{color:var(--er);min-height:1.3em;margin:8px 0;font-size:14px}
.link{background:none;border:0;color:var(--lk);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline}
.gate{max-width:440px;margin:24px auto}
.gate .card{padding:26px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.sp{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:600;font-size:14px}
.sp i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sf);font-style:normal;transition:background .4s,color .4s,transform .4s}
.sp.on{color:var(--tx)}.sp.on i{background:var(--ac);color:#fff;transform:scale(1.15)}
.sp.done i{background:var(--ok);color:#fff}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .25s,border-color .25s}
.sw:hover{transform:scale(1.15)}.sw.on{border-color:var(--tx);transform:scale(1.15)}
.pv{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.pv>svg,.row>svg{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;flex-wrap:wrap;transition:border-color .3s,transform .3s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.row:hover{border-color:var(--ac);transform:translateX(4px)}
.row>.g{flex:1;min-width:170px}
.slot{flex-basis:100%}.slot:empty{display:none}
.slot textarea{margin:8px 0;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.slot>*{animation:pg .4s both}
.bd{padding:2px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.live{color:var(--ok)}.wait{color:var(--wa)}
.drop{display:grid;justify-items:center;gap:2px;padding:24px;border-radius:14px;border:2px dashed var(--lk);color:var(--lk);cursor:pointer;text-align:center;background:linear-gradient(90deg,transparent,var(--ct),transparent) 0 0/200% 100%;animation:sweep 3s linear infinite;transition:transform .25s}
.drop:hover{transform:scale(1.015)}
.drop svg{animation:bob 1.8s ease-in-out infinite}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.th{position:relative;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.th img{height:120px;border-radius:10px;border:1px solid var(--bd);display:block}
.th .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--er);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .25s}
.th .x:hover{transform:rotate(90deg) scale(1.15)}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.9);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(min-width:820px){#toast{bottom:28px}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes pg{from{opacity:0;transform:translateY(14px)}}
@keyframes drop{from{transform:translateY(-100%);opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes grow{from{width:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes sweep{to{background-position:-200% 0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
